---
# The MTA - see docker-compose.yml for the equivalent docker-compose wiring this mirrors, including
# the DKIM/DMARC and inbound-routing design notes repeated there. INBOUND recipient/domain acceptance and
# final delivery route through the postfix-bridge Service below (relay_domains/relay_recipient_maps/
# transport_maps), which translates Postfix's own tcp_table/SMTP protocols into calls against the main
# service's /internal/mta contract - see src/index.ts's own doc comment. OUTBOUND mail from the
# main service Deployment reaches this container over plain SMTP on port 25 (see that Deployment's own
# SENDMAIL_RELAY_HOST env var, defaulting to the "postfix" Service name this file also creates).
#
# TLS: both of Postfix's *internet-facing* directions - inbound smtpd on 25 and outbound smtp client - are
# mandatory TLS, backed by the mail-tls-certs.yaml Secret. The two hops that stay plaintext on purpose are internal to
# the cluster network (main service Deployment -> here, and here -> postfix-bridge via smtp_tls_policy_maps) - see
# mail-tls-policy.yaml for why postfix-bridge specifically is exempted.
#
# WHO MAY DO WHAT on port 25. The image's defaults are for a send-only relay (any client outside mynetworks is rejected,
# and so is any sender outside ALLOWED_SENDER_DOMAINS), which can't receive mail from the internet. This makes it an MX
# that is also the cluster's outbound relay:
#   - a client inside `postfix.internalNetworks` (the main service Deployment) may relay to anywhere, in plaintext, but
#     only as one of ALLOWED_SENDER_DOMAINS or a domain the main service serves (the internal_sender_check class below);
#   - anyone else must use TLS (reject_plaintext_session), and may only send to a domain relay_domains accepts - never
#     relay - from any sender address.
# That split relies on Postfix seeing the client's REAL address: a load balancer that masks it behind an address in
# internalNetworks (k3s' ServiceLB does with externalTrafficPolicy: Cluster) would make every internet client "internal",
# i.e. an open relay for the allowed sender domains. See postfix.externalTrafficPolicy in values.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postfix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postfix
  template:
    metadata:
      labels:
        app: postfix
    spec:
      initContainers:
        # This image signs with OpenDKIM and reads /etc/opendkim/keys/<domain>.private, generating its own key there when
        # the file is missing (DKIM_AUTOGENERATE) - but the key published in DNS (the DNS-setup page) is the one the main
        # service writes to /var/lib/rspamd/dkim/<domain>.<selector>.key. Left alone, Postfix signs with a key nobody
        # published and every DKIM check fails. So the server's key is copied to where the image looks, before it starts;
        # the image then keeps it ("Will not overwrite"). A domain added (or a key replaced) while Postfix runs is picked up
        # by dkim-sync.sh, so this only matters for the first seconds after a start.
        - name: dkim-keys-sync
          image: {{ $.Values.postfix.image.registry }}/{{ $.Values.postfix.image.repository }}:{{ $.Values.postfix.image.tag }}
          command:
            - sh
            - -c
            - |
              for domain in {{ tpl ($.Values.domains | toString) $ | replace "," " " }}; do
                src="/dkim-keys/${domain}.{{ $.Values.dkim.selector }}.key"
                dst="/opendkim-keys/${domain}.private"
                if [ -f "$src" ] && ! cmp -s "$src" "$dst"; then
                  echo "Using the main service's DKIM key for ${domain}"
                  install -m 0400 "$src" "$dst"
                  rm -f "/opendkim-keys/${domain}.txt"
                fi
              done
          volumeMounts:
            - name: dkim-keys
              mountPath: /dkim-keys
              readOnly: true
            - name: dkim-opendkim-keys
              mountPath: /opendkim-keys
      containers:
        - name: postfix
          image: {{ $.Values.postfix.image.registry }}/{{ $.Values.postfix.image.repository }}:{{ $.Values.postfix.image.tag }}
          env:
            # The domains this Postfix knows when it starts: they may send even while the main service is down, and get a DKIM key
            # generated here if the main service hasn't made one. It is NOT the list of domains: every domain the main service
            # serves is picked up while running - inbound acceptance through postfix-bridge, the right to send through
            # internal_sender_check below, and its DKIM key through dkim-sync.sh (mail-tls-policy.yaml) - so a domain added in the
            # admin console needs no change here, no restart and no upgrade.
            - name: ALLOWED_SENDER_DOMAINS
              # The image splits this on whitespace, not commas.
              value: {{ tpl ($.Values.domains | toString) $ | replace "," " " | trim | quote }}
            # Postfix's own SMTP identity (HELO/EHLO name, Received headers) - deliberately kept in sync
            # with the TLS certificate's CN below (both driven by `hostname`). A HELO name that doesn't
            # match the presented certificate is a common deliverability red flag with receiving providers.
            - name: POSTFIX_myhostname
              value: {{ include "postfixBridge.hostname" $ | quote }}
            # This image signs with OpenDKIM, using /etc/opendkim/keys/<domain>.private. The key that matters is the one the
            # main service writes to /var/lib/rspamd/dkim/<domain>.<selector>.key the moment a Domain is created - the one its
            # DNS-setup page tells you to publish - which the dkim-keys-sync init container and dkim-sync.sh put there.
            # DKIM_AUTOGENERATE only makes a key for a domain in ALLOWED_SENDER_DOMAINS the main service hasn't made one for yet.
            - name: DKIM_AUTOGENERATE
              value: {{ $.Values.dkim.autogenerate | quote }}
            - name: DKIM_SELECTOR
              value: {{ $.Values.dkim.selector | quote }}
            # How often dkim-sync.sh (mail-tls-policy.yaml) looks for keys the main service has written for new domains.
            - name: DKIM_SYNC_INTERVAL
              value: {{ $.Values.dkim.syncIntervalSeconds | quote }}
            # Inbound recipient/domain acceptance - both back this deployment's own Domain/mailbox
            # database dynamically via the postfix-bridge Service's tcp_table listeners, so a domain/mailbox
            # added through the admin console is accepted here with no Postfix restart needed. Final
            # delivery of anything accepted goes out over plain SMTP to postfix-bridge's own delivery
            # listener, which hands it to POST /internal/mta/deliver.
            - name: POSTFIX_relay_domains
              value: tcp:postfix-bridge:10040
            - name: POSTFIX_relay_recipient_maps
              value: tcp:postfix-bridge:10041
            - name: POSTFIX_transport_maps
              value: static:smtp:postfix-bridge:2525
            # Postfix's own DNS client doesn't apply the pod's search domains, so it can't find the bare Service name above
            # ("Host or domain name not found ... name=postfix-bridge type=AAAA") and bounces everything it accepts. Falling
            # back to the system resolver, which does, fixes that; the tcp_table lookups already use it.
            - name: POSTFIX_smtp_host_lookup
              value: dns, native
            # TLS is offered to everyone and required of everyone outside internalNetworks by the client
            # restrictions below, rather than "encrypt" for all: "encrypt" would also refuse the main service
            # Deployment's plaintext hop, and every outbound message would be rejected.
            - name: POSTFIX_smtpd_tls_security_level
              value: may
            - name: POSTFIX_mynetworks
              value: {{ join "," $.Values.postfix.internalNetworks | quote }}
            - name: POSTFIX_smtpd_client_restrictions
              value: permit_mynetworks, reject_plaintext_session
            - name: POSTFIX_smtpd_relay_restrictions
              value: permit_mynetworks, reject_unauth_destination
            - name: POSTFIX_smtpd_sender_restrictions
              value: reject_non_fqdn_sender
            # An internal client's sender must be one of ALLOWED_SENDER_DOMAINS (the image builds that map from it, and it
            # answers OK for those, even with the main service down) or a domain the main service serves - asked of postfix-bridge
            # for each message, so a domain added in the admin console may send at once. internal_clients (mail-tls-policy.yaml)
            # maps each internal network to this class.
            - name: POSTFIX_smtpd_restriction_classes
              value: internal_sender_check
            - name: POSTFIX_internal_sender_check
              value: check_sender_access lmdb:/etc/postfix/allowed_senders, check_sender_access pipemap:{regexp:/etc/postfix/sender_domain, tcp:postfix-bridge:10040, regexp:/etc/postfix/any_ok}, reject
            - name: POSTFIX_smtpd_recipient_restrictions
              value: reject_non_fqdn_recipient, reject_unknown_recipient_domain, check_client_access cidr:/etc/postfix/internal_clients, reject_unauth_destination
            - name: POSTFIX_smtpd_tls_cert_file
              value: /etc/postfix/tls/tls.crt
            - name: POSTFIX_smtpd_tls_key_file
              value: /etc/postfix/tls/tls.key
            - name: POSTFIX_smtp_tls_security_level
              value: encrypt
            - name: POSTFIX_smtp_tls_cert_file
              value: /etc/postfix/tls/tls.crt
            - name: POSTFIX_smtp_tls_key_file
              value: /etc/postfix/tls/tls.key
            # Carves out the one destination that's actually internal (postfix-bridge) from the mandatory
            # outbound TLS default above - see mail-tls-policy.yaml for the full explanation.
            - name: POSTFIX_smtp_tls_policy_maps
              value: texthash:/etc/postfix/tls_policy.txt
          ports:
            - containerPort: 25
          resources:
            {{- toYaml $.Values.postfix.resources | nindent 12 }}
          volumeMounts:
            # rspamd's own live signing directory - the other end of the main service Deployment's own
            # mount of this same PVC.
            - name: dkim-keys
              mountPath: /var/lib/rspamd/dkim
            # OpenDKIM's keys, one <domain>.private per domain (see the dkim-keys-sync init container: the main service's
            # key for a domain replaces one the image generated). To supply a different key for a domain, put it here
            # as <domain>.private with no <domain>.<selector>.key in dkim-keys above, and restart.
            - name: dkim-opendkim-keys
              mountPath: /etc/opendkim/keys
            - name: mail-tls
              mountPath: /etc/postfix/tls
              readOnly: true
            - name: mail-tls-policy
              mountPath: /etc/postfix/tls_policy.txt
              subPath: tls_policy.txt
              readOnly: true
            - name: mail-tls-policy
              mountPath: /etc/postfix/internal_clients
              subPath: internal_clients
              readOnly: true
            # Run by the image at startup, without the executable bit (so with bash): see the ConfigMap for what it fixes.
            - name: mail-tls-policy
              mountPath: /docker-init.d/opendkim.sh
              subPath: opendkim.sh
              readOnly: true
            - name: mail-tls-policy
              mountPath: /etc/postfix/sender_domain
              subPath: sender_domain
              readOnly: true
            - name: mail-tls-policy
              mountPath: /etc/postfix/any_ok
              subPath: any_ok
              readOnly: true
            - name: mail-tls-policy
              mountPath: /opt/postfix-bridge/dkim-sync.sh
              subPath: dkim-sync.sh
              readOnly: true
      volumes:
        - name: dkim-keys
          persistentVolumeClaim:
            claimName: {{ include "postfixBridge.dkimKeysClaim" . }}
        - name: dkim-opendkim-keys
          persistentVolumeClaim:
            claimName: {{ include "rrst.fullname" . }}-dkim-opendkim-keys
        - name: mail-tls
          secret:
            secretName: {{ include "postfixBridge.tlsSecretName" . }}
        - name: mail-tls-policy
          configMap:
            name: {{ include "rrst.fullname" . }}-mail-tls-policy
