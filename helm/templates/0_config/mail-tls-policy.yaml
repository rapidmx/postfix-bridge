apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rrst.fullname" . }}-mail-tls-policy
  namespace: {{ $.Release.Namespace }}
data:
  # Postfix smtp_tls_policy_maps (texthash) override - see postfix.yaml for how this is mounted/wired in
  # (POSTFIX_smtp_tls_policy_maps=texthash:/etc/postfix/tls_policy.txt), and docker-compose.yml's
  # docker/postfix/tls_policy.txt for the identical Docker Compose equivalent.
  #
  # The deployment-wide default (POSTFIX_smtp_tls_security_level=encrypt) makes TLS mandatory for every
  # OUTBOUND delivery - required so nothing leaves this deployment over an internet link in the clear. The
  # one destination that's actually internal, not internet-facing, is postfix-bridge's own delivery Service
  # (see src/SmtpDeliveryServer.ts) - it has no TLS/STARTTLS support at all by design, since it's
  # reachable only from this Postfix Deployment over the cluster-internal network. Without this override,
  # the global "encrypt" default would make Postfix refuse to hand accepted mail to postfix-bridge at all. Both
  # forms of the lookup key are listed since Postfix tries the full "host:port" form first and falls back
  # to just "host".
  tls_policy.txt: |
    postfix-bridge:2525    none
    postfix-bridge         none
  # check_client_access table (postfix.yaml): each network in postfix.internalNetworks is sent through the
  # internal_sender_check class, i.e. may relay as one of ALLOWED_SENDER_DOMAINS. Anyone else isn't listed.
  internal_clients: |
    {{- range $.Values.postfix.internalNetworks }}
    {{ . }}    internal_sender_check
    {{- end }}
  # Run by the image's startup (from /docker-init.d, after it has written OpenDKIM's config, before OpenDKIM starts). Two things
  # its OpenDKIM setup gets wrong for a Postfix that is also the public MX:
  #
  # 1. OpenDKIM (libunbound) fails every key lookup through the container's resolver with "unexpected reply class/type
  #    (-1/-1)" unless it's told which name server to ask, so it could never verify a signature and never stamped an
  #    Authentication-Results result - which is what the RapidMX server's mail.trustedAuthservId trusts.
  # 2. The image lists every address (0.0.0.0/0, read as a regular expression, which matches nothing) as OpenDKIM's "internal
  #    hosts" - the ones it signs for rather than verifies - so anyone who could reach port 25 got their mail signed as any
  #    of our domains. Only the networks Postfix itself trusts to relay (postfix.internalNetworks) are internal.
  opendkim.sh: |
    ns=$(awk '/^nameserver/ { print $2; exit }' /etc/resolv.conf)
    if [ -n "$ns" ]; then
      echo "Using name server $ns for OpenDKIM key lookups"
      sed -i -E '/^[[:space:]]*#?[[:space:]]*Nameservers/d' /etc/opendkim/opendkim.conf
      printf 'Nameservers             %s\n' "$ns" >> /etc/opendkim/opendkim.conf
    fi
    if [ -n "$POSTFIX_mynetworks" ]; then
      echo "Signing only mail from $POSTFIX_mynetworks"
      sed -i -E '/^[[:space:]]*#?[[:space:]]*InternalHosts/d' /etc/opendkim/opendkim.conf
      printf 'InternalHosts           %s\n' "$POSTFIX_mynetworks" >> /etc/opendkim/opendkim.conf
    fi
