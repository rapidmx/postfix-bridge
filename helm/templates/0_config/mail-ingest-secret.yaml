---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rrst.fullname" . }}-mail-ingest-secret
type: Opaque
data:
  # Bearer secret authenticating postfix-bridge's calls to the RapidMX server's /internal/mta routes (see
  # postfix-bridge.yaml) - consumed here under this bridge's own plain env var name (see src/index.ts). The
  # RapidMX server's own chart is a separate release and must be configured with the identical value
  # under its own mail__transport__ingest__secret key for the two sides to agree.
  MTA_INGEST_SECRET: {{ tpl .Values.ingestSecret . | b64enc | quote }}
