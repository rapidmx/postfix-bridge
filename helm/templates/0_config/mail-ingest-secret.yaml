{{- /* `required` for an empty value, so `helm lint` still passes; the old placeholder fails outright. */}}
{{- $ingestSecret := required "ingestSecret is required: set it to the same unique, secret value as the RapidMX server's mail.ingestSecret." (tpl (.Values.ingestSecret | default "" | toString) .) }}
{{- if eq $ingestSecret "ChangeMeIngestSecret" }}
{{- fail "ingestSecret is still the ChangeMeIngestSecret placeholder: set it to the same unique, secret value as the RapidMX server's mail.ingestSecret." }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rrst.fullname" . }}-mail-ingest-secret
type: Opaque
data:
  # Bearer secret authenticating postfix-bridge's calls to the RapidMX server's /internal/mta routes (see
  # mta-bridge.yaml), under this bridge's own env var name (see src/index.ts). The server must be configured with the
  # identical value (its mail__transport__ingest__secret).
  MTA_INGEST_SECRET: {{ $ingestSecret | b64enc | quote }}
