{{- if not (tpl (.Values.dkim.storage.existingClaim | default "") .) }}
---
# rspamd's DKIM signing keys (postfix.yaml mounts it at /var/lib/rspamd/dkim). The RapidMX server's FsDkimKeyProvider
# writes the keys there, so the server must mount the same volume: point this chart at the server's claim with
# dkim.storage.existingClaim (the server's chart does that for its bundled postfix-bridge), in which case this PVC isn't
# created.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rrst.fullname" . }}-dkim-keys
spec:
  accessModes:
    - {{ .Values.dkim.storage.accessMode }}
  {{- with include "postfixBridge.storageClassName" (dict "value" .Values.dkim.storage.storageClassName "context" .) }}
  {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.dkim.storage.size }}
{{- end }}
---
# To supply your own DKIM key pair for a domain instead of relying on the RapidMX server's own
# FsDkimKeyProvider/DKIM_AUTOGENERATE (recommended for production): drop the standard opendkim-genkey
# output - <domain>/<selector>.private (PEM RSA private key) and <domain>/<selector>.txt (the DNS TXT record
# text) - into this volume under /etc/opendkim/keys/<domain>/ (mounted only by the postfix Deployment);
# this image's own startup script imports it into rspamd's native format (the dkim-keys PVC above) on
# container start. Only ever mounted by one Deployment, so always ReadWriteOnce regardless of topology.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rrst.fullname" . }}-dkim-opendkim-keys
spec:
  accessModes:
    - ReadWriteOnce
  {{- with include "postfixBridge.storageClassName" (dict "value" .Values.dkim.storage.storageClassName "context" .) }}
  {{ . }}
  {{- end }}
  resources:
    requests:
      storage: 256Mi
