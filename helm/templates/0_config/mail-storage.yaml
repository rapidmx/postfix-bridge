{{- if not (tpl (.Values.dkim.storage.existingClaim | default "") .) }}
---
# rspamd's DKIM signing keys (postfix.yaml mounts it at /var/lib/rspamd/dkim). The RapidMX server's FsDkimKeyProvider
# writes the keys there, so the server must mount the same volume: point this chart at the server's claim with
# dkim.storage.existingClaim (the server's chart does that for its bundled postfix-bridge), in which case this PVC isn't
# created.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rrst.fullname" . }}-dkim-keys
spec:
  accessModes:
    - {{ .Values.dkim.storage.accessMode }}
  {{- with include "postfixBridge.storageClassName" (dict "value" .Values.dkim.storage.storageClassName "context" .) }}
  {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.dkim.storage.size }}
{{- end }}
---
# OpenDKIM's keys (postfix.yaml mounts it at /etc/opendkim/keys). dkim-sync.sh (mail-tls-policy.yaml) owns
# <domain>/ and <domain>.private for every domain the RapidMX server has a key for: <domain>/<selector>.private
# for the selector it signs with (and the one a rotation moved off, until the server deletes it), and
# <domain>/selector naming the one in use. To supply your own key for a domain the server has no key for, put
# the PEM private key here as <domain>.private (not opendkim-genkey's <domain>/<selector>.private, which nothing
# reads) and restart Postfix: it is signed with dkim.selector. Only ever mounted by one Deployment, so always
# ReadWriteOnce regardless of topology.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rrst.fullname" . }}-dkim-opendkim-keys
spec:
  accessModes:
    - ReadWriteOnce
  {{- with include "postfixBridge.storageClassName" (dict "value" .Values.dkim.storage.storageClassName "context" .) }}
  {{ . }}
  {{- end }}
  resources:
    requests:
      storage: 256Mi
