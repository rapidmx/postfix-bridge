{{- /*
Postfix's TLS certificate for its public host name (`hostname`), used by postfix.yaml's smtpd_tls_cert_file and
smtp_tls_cert_file, which make TLS mandatory in both directions. Postfix can't start without a certificate file, so the
chart always provides one unless tls.existingSecret names your own:
- a cert-manager Certificate (tls.certManager.issuerName/issuerKind) for a public hostname while tls.certManager.enabled;
- otherwise (localhost, *.local, or cert-manager disabled) a self-signed certificate, kept across upgrades while the
  hostname is unchanged (a new one is generated when it changes).
*/}}
{{- $hostname := include "postfixBridge.hostname" . }}
{{- $secretName := include "postfixBridge.tlsSecretName" . }}
{{- $publicHostname := and (ne $hostname "localhost") (not (contains ".local" $hostname)) }}
{{- if not (tpl (.Values.tls.existingSecret | default "") .) }}
{{- if and .Values.tls.certManager.enabled $publicHostname }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "rrst.fullname" . }}-mail-tls
  namespace: {{ $.Release.Namespace }}
spec:
  secretName: {{ $secretName }}
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  subject:
    organizations:
      - RapidMX
  commonName: {{ $hostname }}
  isCA: false
  privateKey:
    algorithm: ECDSA
    encoding: PKCS1
    size: 384
  usages:
    - server auth
    - client auth
  dnsNames:
  - {{ $hostname }}
  issuerRef:
    name: {{ tpl .Values.tls.certManager.issuerName . }}
    kind: {{ tpl .Values.tls.certManager.issuerKind . }}
{{- else }}
---
{{- /*
Reused from the existing Secret while it's this chart's self-signed one for the same host name (the annotation), so an
upgrade doesn't replace the certificate. A Secret cert-manager wrote (after switching tls.certManager.enabled off) has no
such annotation and gets replaced.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName | default dict }}
{{- $existingData := get $existing "data" | default dict }}
{{- $existingHost := dig "metadata" "annotations" "postfix-bridge.rapidmx.dev/self-signed-for" "" $existing }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    postfix-bridge.rapidmx.dev/self-signed-for: {{ $hostname | quote }}
type: kubernetes.io/tls
data:
  {{- if and (eq $existingHost $hostname) (get $existingData "tls.crt") (get $existingData "tls.key") }}
  tls.crt: {{ get $existingData "tls.crt" }}
  tls.key: {{ get $existingData "tls.key" }}
  {{- else }}
  {{- $cert := genSelfSignedCert $hostname nil (list $hostname) 3650 }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
