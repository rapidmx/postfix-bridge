common:
  storageClass: default
mail:
  # Bearer secret authenticating postfix-bridge's calls to the RapidMX server's /internal/mta routes. Must be
  # set to the exact same value as that chart's own mail__transport__ingest__secret - the two charts are
  # separate Helm releases, so nothing keeps them in sync automatically.
  ingestSecret: ChangeMeIngestSecret
  # Base URL of the RapidMX server's /internal/mta contract this bridge forwards to - point this at
  # wherever that chart's release actually resolves from within the cluster (e.g.
  # http://<server-release>-services.<namespace>.svc.cluster.local/internal/mta).
  ingestBaseUrl: http://server-services/internal/mta
  domains: example.com
  hostname: mail.localhost
  dkim:
    selector: mail
    autogenerate: true
    storage:
      storageClassName: '{{ .Values.common.storageClass }}'
      accessMode: ReadWriteOnce
      size: 1Gi
  postfix:
    image:
      registry: docker.io
      repository: boky/postfix
      tag: latest
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
    serviceType: LoadBalancer
  mtaBridge:
    image:
      registry: ghcr.io
      repository: rapidmx/postfix-bridge
      tag: 0.1.0
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
