name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:24-trixie-slim
    steps:
      - uses: actions/checkout@v6

      - name: Enable corepack
        run: corepack enable

      - name: Cache node_modules, dist
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            dist
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build

      - name: Lint
        run: yarn lint

  test:
    runs-on: ubuntu-latest
    needs: build
    container:
      image: node:24-trixie-slim
    steps:
      - uses: actions/checkout@v6

      - name: Enable corepack
        run: corepack enable

      - name: Restore node_modules cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install system dependencies
        run: apt-get update && apt-get install -y --no-install-recommends build-essential python3 ca-certificates libcurl4 curl

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit
          path: junit.xml

      - name: Report coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./coverage/lcov.info

  test-docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - name: Docker build test
        run: |
          docker build -t ${{ github.event.repository.name }} . --no-cache
          docker rmi ${{ github.event.repository.name }}

  test-helm:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - name: Run Lint
        run: helm lint ./helm

  validate:
    runs-on: ubuntu-latest
    needs: build
    container:
      image: node:24-trixie-slim
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Enable corepack
        run: corepack enable

      - name: Run validation script
        run: |
          set +e
          bash ./validate.sh

  # A release pushes the default branch and its tag at the same commit, and each push runs this workflow. Publish only
  # from the tag's run, once every other job of it has passed and every other run of this workflow for that commit has
  # finished green: a failed run on either ref (even one that passes when rerun) blocks the release until it is rerun
  # green and this job is rerun after it.
  release-gate:
    runs-on: ubuntu-latest
    needs: [build, test, test-docker-build, test-helm, validate]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require a release tag on the default branch and every other run of its commit green
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if ! git tag --points-at HEAD | grep -qxF "$TAG" || ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag $TAG doesn't point at $SHA on $DEFAULT_BRANCH; not publishing."
            exit 1
          fi
          workflow_id=$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          url="repos/$REPO/actions/workflows/$workflow_id/runs?head_sha=$SHA&per_page=100"
          others="[.workflow_runs[] | select(.id != $GITHUB_RUN_ID)]"
          for attempt in $(seq 1 90); do
            pending=$(gh api "$url" --jq "$others | map(select(.status != \"completed\")) | length")
            failed=$(gh api "$url" --jq "$others | map(select(.status == \"completed\" and .conclusion != \"success\")
              | \"\(.id) (\(.head_branch)): \(.conclusion)\") | join(\", \")")
            if [ -n "$failed" ]; then
              echo "::error::Not publishing $TAG: another run of this workflow for $SHA did not succeed: $failed. Rerun it green, then rerun this job."
              exit 1
            fi
            if [ "$pending" = 0 ]; then
              echo "Every other run of this workflow for $SHA succeeded: $(gh api "$url" --jq "$others | map(\"\(.id) (\(.head_branch))\") | join(\", \")")"
              exit 0
            fi
            sleep 20
          done
          echo "::error::Timed out waiting for the other runs of this workflow for $SHA to finish."
          exit 1

  publish-docker-image:
    runs-on: ubuntu-latest
    needs: release-gate
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    environment: publish
    steps:
      - uses: actions/checkout@v6

      - name: Extract package name
        id: pkg
        run: |
          echo "name=$(yq '.name' package.json)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
          -u ${{ github.actor }} \
          --password-stdin

      - name: Build image
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/${{ steps.pkg.outputs.name }}
          docker build -t $IMAGE_NAME:latest .

      - name: Push images
        env:
          REGISTRY: ${{ secrets.NEXUS_REGISTRY }}
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/${{ steps.pkg.outputs.name }}
          TAG=${GITHUB_REF#refs/tags/v}

          docker push $IMAGE_NAME:latest
          docker tag $IMAGE_NAME:latest $IMAGE_NAME:$TAG
          docker push $IMAGE_NAME:$TAG

      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/${{ steps.pkg.outputs.name }}/visibility" \
            -d '{"visibility":"public"}'

  publish-helm-chart:
    runs-on: ubuntu-latest
    needs: release-gate
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    environment: publish
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - name: Extract chart name
        id: pkg
        run: |
          echo "name=$(yq '.name' ./helm/Chart.yaml)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Package chart
        run: |
          helm package ./helm \
            --version "${GITHUB_REF#refs/tags/v}" \
            --app-version "${GITHUB_REF#refs/tags/v}"

      - name: Push chart to GHCR
        run: |
          CHART_NAME="${{ steps.pkg.outputs.name }}"
          CHART_VERSION="${GITHUB_REF#refs/tags/v}"
          helm push "${CHART_NAME}-${CHART_VERSION}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Make chart public
        run: |
          curl -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/orgs/${{ github.repository_owner }}/packages/helm/${{ steps.pkg.outputs.name }}/visibility" \
            -d '{"visibility":"public"}'
